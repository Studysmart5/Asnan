<div class="ov-head">
  <div class="ov-box">
    <h3>Core idea</h3>
    <p>Jaw defects arise from pathology, trauma, infection, or congenital deformity and range from small alveolar clefts to mandibulectomy and maxillectomy defects. Bone is the main replacement tissue: grafts heal by regeneration through osteogenesis, osteoinduction and osteoconduction, and graft types (autogenous, allogeneic, xenogeneic, alloplastic) differ in their cells, immunologic response and donor-site needs. Adjuvants (BMPs, platelet concentrates) enhance repair. Successful reconstruction depends on careful assessment of the hard and soft tissue defect, and mandibular defects are classified (HCL) and reconstructed with plates, non-vascularized grafts, pedicled flaps or vascularized free tissue transfer.</p>
    <h3 style="margin-top:12px">Roadmap · 11 units + Exam Focus</h3>
    <div class="ov-path"><span>01 Jaw defects</span><span>02 Bone generation</span><span>03 Two-phase theory</span><span>04 Autogenous grafts</span><span>05 Free vs composite</span><span>06 Allo- &amp; xenografts</span><span>07 Alloplasts &amp; BMPs</span><span>08 Platelet concentrates</span><span>09 Combinations &amp; assessment</span><span>10 Mandibular defects</span><span>11 Reconstructive options</span></div>
  </div>

    <ul>
      <li>List the causes of jaw defects and the goals of reconstruction.</li>
      <li>Define a graft and distinguish osteogenesis, osteoinduction and osteoconduction.</li>
      <li>Explain phase I and phase II of the two-phase theory of osteogenesis.</li>
      <li>Compare autogenous, allogeneic, xenogeneic grafts and alloplasts.</li>
      <li>Recall autogenous donor sites with their yields and complications.</li>
      <li>Describe BMPs and the three generations of platelet concentrates (PRP, PRF, CGF).</li>
      <li>Assess hard and soft tissue defects before reconstruction.</li>
      <li>Apply the HCL classification and choose among mandibular reconstructive options.</li>
    </ul>

<!-- ============ UNIT 1 ============ -->
<details class="ov-unit" data-title="Defects of the jaws &amp; goals of reconstruction" data-sub="Causes, size range, goals and challenges">
<p class="ov-src">Source: Page 1</p>
<div class="ov-core"><b>Core idea:</b> Jaw bone defects have several causes and vary widely in size; reconstruction aims to restore oral function and appearance while allowing follow-up.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Causes of jaw defects</div>
<p>Defects of the jaw bones have a variety of causes, such as:</p>
<ul>
<li>Eradication of pathologic conditions</li>
<li>Trauma</li>
<li>Infections</li>
<li>Congenital deformities</li>
</ul></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Size of defects</div>
<p>The size of the defects that are commonly reconstructed in the oral and maxillofacial region varies considerably, from small <b>alveolar clefts</b> to <b>mandibulectomy</b> or <b>maxillectomy</b> defects.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">The goals of reconstruction</div>
<p>The goals of successful reconstruction are:<span class="hy">★</span></p>
<ol>
<li>To recreate normal oral function.</li>
<li>To provide a satisfactory cosmetic result.</li>
<li>To permit prompt and careful follow-up.</li>
</ol>
<p>This can be challenging, as oral cavity defects can extend to involve critical sites and cause significant functional disabilities in terms of <b>airway, speech, swallowing, and/or mastication</b>.</p></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>4 causes: eradication of pathology, trauma, infections, congenital deformities.</li>
<li>Size range: small alveolar clefts → mandibulectomy or maxillectomy defects.</li>
<li>3 goals: normal oral function, satisfactory cosmetic result, prompt and careful follow-up.</li>
<li>Defects reaching critical sites affect airway, speech, swallowing and/or mastication.</li>
</ul></details>

<!-- ============ UNIT 2 ============ -->
<details class="ov-unit" data-title="Bone reconstruction &amp; mechanisms of bone generation" data-sub="Graft definition, healing by regeneration, osteogenesis / osteoinduction / osteoconduction">
<p class="ov-src">Source: Pages 1–2</p>
<div class="ov-core"><b>Core idea:</b> Bone is the tissue most used to replace lost bone; grafts heal by regeneration (not scar repair) through three mechanisms of bone generation.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Bone reconstruction</div>
<p>The tissue most commonly used to replace lost osseous tissue is <b>bone</b>. Recent advancements in the understanding of <b>bone physiology, immunologic concepts, tissue-banking procedures, and surgical principles</b> have made possible the successful reconstruction of most maxillofacial bony defects.</p>
<div class="defs">
<div class="def"><b>Graft</b><span class="hy">★</span><p>A tissue that is transplanted and expected to become a part of the host to which it is transplanted.</p></div>
</div>
<p>The healing of bone and bone grafts is by <b>new bone formation that arises from tissue regeneration</b> rather than from simple tissue repair with scar formation; this requires <b>cellular proliferation and collagen synthesis</b>.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">The three basic mechanisms of bone generation</div>
<div class="defs">
<div class="def"><b>1. Osteogenesis</b><span class="hy">★</span><p>The formation of new bone from living cells transplanted within the graft.</p></div>
<div class="def"><b>2. Osteoinduction</b><span class="hy">★</span><p>New bone formation through the recruitment and stimulation of recipient site osteoprogenitor cells using bone growth factors transplanted within the grafted material.</p></div>
<div class="def"><b>3. Osteoconduction</b><p>The physical process in which the graft acts as a 3D scaffold on which the cells are able to form new bone.</p></div>
</div>
<figure class="ov-fig"><figcaption>Figure 2.1 — The three mechanisms compared (table built from Pages 1–2; no figure in the source)</figcaption>
<div class="sc"><table><thead><tr><th>Mechanism</th><th>Bone is formed by…</th><th>What the graft provides</th></tr></thead><tbody>
<tr><td>Osteogenesis</td><td>Living cells transplanted within the graft</td><td>The living cells</td></tr>
<tr><td>Osteoinduction</td><td>Recipient site osteoprogenitor cells (recruited and stimulated)</td><td>Bone growth factors within the grafted material</td></tr>
<tr><td>Osteoconduction</td><td>Cells forming new bone on the graft</td><td>A physical 3D scaffold</td></tr>
</tbody></table></div></figure></div>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>Osteogenesis</b> = new bone from <i>transplanted living cells</i>; <b>osteoinduction</b> = <i>recipient</i> osteoprogenitor cells recruited by growth factors; <b>osteoconduction</b> = graft is only a <i>3D scaffold</i>.</li>
<li>Bone graft healing is <b>regeneration</b> (cellular proliferation + collagen synthesis), not simple <b>repair with scar formation</b>.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Bone is the tissue most commonly used to replace lost osseous tissue.</li>
<li>Graft = transplanted tissue expected to become part of the host.</li>
<li>Healing = regeneration requiring cellular proliferation and collagen synthesis.</li>
<li>Three mechanisms: osteogenesis, osteoinduction, osteoconduction.</li>
</ul></details>

<!-- ============ UNIT 3 ============ -->
<details class="ov-unit" data-title="Two-phase theory of osteogenesis" data-sub="Phase I from graft cells · Phase II from the host bed">
<p class="ov-src">Source: Page 2</p>
<div class="ov-core"><b>Core idea:</b> When bone is autotransplanted, graft incorporation proceeds in two phases: phase I from surviving transplanted cells, then phase II from the host graft bed starting about the second week.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Context</div>
<p>When bone is transplanted from one area of the body to another (<b>autotransplantation</b>), several processes become active during the incorporation of the graft.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Phase I</div>
<ul>
<li>Bone regeneration arises from <b>transplanted cells in the graft</b> that proliferate and form <b>new osteoid</b>.</li>
<li>The amount of bone regeneration during this phase depends on the <b>number of transplanted bone cells that survive</b> the grafting procedure.<span class="hy">★</span></li>
<li>When the graft is removed from the body, the blood supply has been severed. Thus, the cells in the bone graft depend on <b>diffusion of nutrients from the surrounding graft bed</b> for survival.</li>
</ul></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">Phase II</div>
<ul>
<li>Begins approximately in the <span class="v">second week</span>.<span class="hy">★</span></li>
<li><b>Angiogenesis</b> and <b>fibroblastic proliferation</b> from the graft bed begin after grafting, and <b>osteogenesis from host connective tissues</b> begins.</li>
<li>Fibroblasts and other mesenchymal cells differentiate into <b>osteoblasts</b> and begin to lay down new bone.</li>
<li>This phase is also responsible for the <b>orderly incorporation</b> of the graft into the host bed with continued <b>resorption, replacement, and remodeling</b>.</li>
</ul></div>
<figure class="ov-fig"><figcaption>Figure 3.1 — Phase I vs phase II, step by step (interactive; built from Page 2 text, no figure in the source)</figcaption>
<ol class="stepper"><li><b>Grafting (autotransplantation)</b> — The graft is removed from the body; its blood supply has been severed.</li><li><b>Phase I · graft cell survival</b> — Cells in the bone graft depend on diffusion of nutrients from the surrounding graft bed for survival.</li><li><b>Phase I · new osteoid</b> — Transplanted cells in the graft proliferate and form new osteoid. The amount depends on the number of transplanted bone cells that survive.</li><li><b>Phase II · ~second week</b> — Angiogenesis and fibroblastic proliferation from the graft bed; osteogenesis from host connective tissues begins.</li><li><b>Phase II · osteoblasts</b> — Fibroblasts and other mesenchymal cells differentiate into osteoblasts and lay down new bone.</li><li><b>Phase II · incorporation</b> — Orderly incorporation of the graft into the host bed with continued resorption, replacement, and remodeling.</li></ol>
</figure>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>Phase I</b> bone comes from <i>transplanted graft cells</i> (depends on how many survive); <b>phase II</b> bone comes from <i>host connective tissues</i> of the graft bed (from ~the second week).</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Phase I: transplanted cells proliferate → new osteoid.</li>
<li>Phase I amount = number of surviving transplanted cells; survival by diffusion from graft bed.</li>
<li>Phase II starts ~2nd week: angiogenesis, fibroblastic proliferation, host osteogenesis.</li>
<li>Phase II gives orderly incorporation: resorption, replacement, remodeling.</li>
</ul></details>

</details>

<!-- ============ UNIT 4 ============ -->
<details class="ov-unit" data-title="Types of grafts · Autogenous grafts: forms &amp; donor sites" data-sub="Classification, block vs particulate grafts, intraoral and extraoral donor sites">
<p class="ov-src">Source: Pages 2–4</p>
<div class="ov-core"><b>Core idea:</b> Bone grafts are classified by origin (and thus immunologic potential). Autogenous grafts are the only type supplying living immunocompatible cells for phase I; they are harvested as block or particulate grafts from intraoral or extraoral sites, each with its own yield and complications.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Classification of bone grafts</div>
<p>Several types of bone grafts are available for use in reconstructive surgery. A useful classification categorizes the bone grafts according to their <b>origin</b> and thus their <b>potential to induce an immunologic response</b>: autogenous grafts, allogeneic grafts, xenogeneic grafts and alloplasts (Units 4–7).</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Autogenous grafts</div>
<div class="defs"><div class="def"><b>Autogenous grafts (autografts, self-grafts)</b><p>Grafts composed of tissues from the same individual.</p></div></div>
<ul>
<li>It is the <b>only type of bone graft</b> that can supply living, immunocompatible bone cells essential to <b>phase I osteogenesis</b>.<span class="hy">★</span></li>
<li>Autogenous bone is the type used <b>most frequently</b> in oral-maxillofacial surgery.</li>
<li>The bone to be transplanted can be obtained from a host of sites in the body and can be taken in several forms.</li>
</ul></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">Forms of autogenous grafts</div>
<div class="sc"><table><thead><tr><th>Form</th><th>Description</th><th>Notes</th></tr></thead><tbody>
<tr><td>Block grafts</td><td>Solid pieces of cortical bone with or without underlying cancellous bone (corticocancellous)</td><td>The iliac crest and the ribs are often used as a source</td></tr>
<tr><td>Particulate marrow and cancellous bone grafts</td><td>Obtained by harvesting the medullary bone and the associated endosteum and hematopoietic marrow</td><td>Produce the greatest concentration of osteogenic cells<span class="hy">★</span>; because of the particulate nature, more cells survive transplantation thanks to their access to nutrients in the surrounding graft bed</td></tr>
</tbody></table></div>
<p>The <b>ideal bone graft</b> should have the structural characteristics of a block graft with the osteogenic potential of particulate marrow and cancellous bone grafts.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="4">Common donor sites</div>
<p><b>Intraoral sites</b> are limited by size, quality, and amount of cancellous bone.</p>
<div class="sc"><table><thead><tr><th>Site</th><th>Graft provided</th><th>Size / yield</th><th>Possible complications</th></tr></thead><tbody>
<tr><td>Ramus of mandible (intraoral)</td><td>Cortical bone</td><td><span class="v">about 1 cm × 3 cm</span></td><td>Inferior alveolar nerve injury; mandible fracture</td></tr>
<tr><td>Symphysis (intraoral)</td><td>Cortical and corticocancellous blocks</td><td><span class="v">about 1.5 cm × 4 cm</span>, thickness <span class="v">1 cm</span></td><td>Mental nerve injury; chin ptosis</td></tr>
<tr><td>Anterior iliac crest (extraoral)</td><td>Corticocancellous blocks; cancellous bone graft</td><td>Blocks up to <span class="v">5 cm × 5 cm</span>; cancellous bone <span class="v">about 50 cc</span><span class="hy">★</span></td><td>Gait disturbance, fracture of the anterior iliac spine, postoperative ileus, hematoma, seroma, postoperative paresthesias</td></tr>
<tr><td>Cranium (extraoral)</td><td>Cortical bone with limited amounts of cancellous bone; the parietal bone is the ideal site to harvest from</td><td><span class="v">1 cm × 4 cm</span> increments</td><td>Hemorrhage of superior sagittal sinus, dural tear, meningitis, hair loss</td></tr>
<tr><td>Rib (extraoral)</td><td>Cortical bone graft with or without a cartilaginous cap</td><td>Not stated in the source</td><td>Pneumothorax, cosmetic deformity, intercostal paresthesia</td></tr>
<tr><td>Tibia (extraoral)</td><td>Cancellous bone</td><td><span class="v">about 40 cc</span></td><td>Wound dehiscence, gait disturbance, fracture of tibial plateau</td></tr>
</tbody></table></div></div>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>Ramus</b> = cortical bone about 1 cm × 3 cm (inferior alveolar nerve injury, mandible fracture) vs <b>symphysis</b> = blocks about 1.5 cm × 4 cm × 1 cm (mental nerve injury, chin ptosis).</li>
<li>Cancellous yield: <b>anterior iliac crest about 50 cc</b> vs <b>tibia about 40 cc</b>.</li>
<li><b>Block grafts</b> give structure; <b>particulate marrow and cancellous grafts</b> give the greatest concentration of osteogenic cells.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Classification by origin → potential to induce an immunologic response.</li>
<li>Autogenous = same individual; only source of living immunocompatible cells for phase I; most used.</li>
<li>Ideal graft = block structure + particulate osteogenic potential.</li>
<li>Intraoral sites limited by size, quality and amount of cancellous bone.</li>
<li>Parietal bone = ideal cranial harvest site.</li>
</ul></details>

<!-- ============ UNIT 5 ============ -->
<details class="ov-unit" data-title="Non-vascularized vs composite grafts" data-sub="Free grafts, pedicled flaps, vascularized free tissue transfer, pros and cons of autogenous grafts">
<p class="ov-src">Source: Page 4</p>
<div class="ov-core"><b>Core idea:</b> Most harvested grafts lose their blood supply (free grafts) and survive by diffusion; composite grafts keep their blood supply through a pedicle or microvascular anastomosis, so more osteogenic cells can survive.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Non-vascularized (free) grafts</div>
<p>The bone grafts above are detached from their blood supply during harvesting (<b>non-vascularized grafts or free grafts</b>) and they depend on <b>diffusion of nutrients from the surrounding graft bed</b> for survival.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Composite grafts</div>
<div class="defs"><div class="def"><b>Composite grafts</b><span class="hy">★</span><p>Transplanted autogenous bone grafts that maintain their blood supply, so the number of surviving osteogenic cells is potentially more. Known as composite grafts because they contain soft tissue and osseous elements.</p></div></div>
<p>This can be accomplished by two methods:</p>
<ol>
<li><b>Pedicled flaps</b>: the bone graft is pedicled to a muscular (or muscular and skin) pedicle, preserving some blood supply to the bone graft.</li>
<li><b>Vascularized free tissue transfer</b>: the autogenous bone is transplanted without losing its blood supply by the use of microsurgical techniques (steps below).</li>
</ol>
<figure class="ov-fig"><figcaption>Figure 5.1 — Vascularized free tissue transfer, step by step (interactive; built from Page 4 text, no figure in the source)</figcaption>
<ol class="stepper"><li><b>Harvest</b> — The bone is harvested along with the overlying soft tissue.</li><li><b>Dissect the vessels</b> — An artery and a vein that supply the tissue are dissected free.</li><li><b>Reconnect</b> — The artery and vein are reconnected with the artery and vein in the recipient bed.</li><li><b>Microvascular anastomosis</b> — The reconnection is done by microvascular anastomosis, so the bone is transplanted without losing its blood supply.</li></ol>
</figure></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">Advantages and disadvantages of autogenous grafts</div>
<div class="sc"><table><thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td style="font-weight:400">They provide osteogenic cells for phase I bone formation.<br>No immunologic response occurs.</td><td>Necessitate another site of operation for procurement of the graft (<b>donor site morbidity</b>).<span class="hy">★</span></td></tr>
</tbody></table></div></div>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>Free (non-vascularized) graft</b>: blood supply detached, survives by diffusion · <b>composite graft</b>: blood supply maintained, contains soft tissue + osseous elements.</li>
<li><b>Pedicled flap</b> keeps <i>some</i> blood supply via a muscular pedicle · <b>vascularized free tissue transfer</b> reconnects artery and vein by microvascular anastomosis.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Free grafts depend on diffusion of nutrients from the graft bed.</li>
<li>Composite grafts keep blood supply → potentially more surviving osteogenic cells.</li>
<li>Two methods: pedicled flaps; vascularized free tissue transfer.</li>
<li>Autogenous: phase I cells + no immune response, but donor site morbidity.</li>
</ul></details>

</details>

<!-- ============ UNIT 6 ============ -->
<details class="ov-unit" data-title="Allogeneic &amp; xenogeneic grafts" data-sub="Immune response, graft treatment, freeze-dried bone, advantages and disadvantages">
<p class="ov-src">Source: Pages 5–6</p>
<div class="ov-core"><b>Core idea:</b> Grafts from another individual (allogeneic) or another species (xenogeneic) provoke an immune response, so they are treated to reduce antigenicity — which destroys their osteogenic cells, leaving only a matrix for phase II.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Allogeneic grafts</div>
<div class="defs"><div class="def"><b>Allogeneic grafts (allografts, homografts)</b><p>Grafts taken from another individual of the same species.</p></div></div>
<ol class="steps">
<li>Because the individuals are genetically dissimilar, the graft is recognized as a foreign substance by the host, which mounts an intense response in an attempt to destroy the graft.</li>
<li>The response is primarily a <b>cell-mediated response by T-lymphocytes</b>.<span class="hy">★</span></li>
<li>Therefore, the graft is treated to alter its antigenicity so that the host's immune response will not be stimulated.</li>
</ol>
<p>Methods of treating grafts include: <b>boiling, deproteinization, freezing, freeze-drying, irradiation, and dry heating</b>.</p>
<p>All of these treatments destroy any remaining osteogenic cells in the graft; therefore allogeneic bone grafts <b>cannot participate in phase I osteogenesis</b> — they offer a <b>hard tissue matrix for phase II induction</b>.<span class="hy">★</span></p>
<p>Today, the most commonly used allogeneic bone is <b>freeze dried</b>.</p>
<div class="sc"><table><thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td style="font-weight:400">Do not require another site of operation in the host.<br>A bone of similar shape to that being replaced can be obtained (e.g., an allogeneic mandible for reconstruction of a mandibulectomy defect).</td><td style="font-weight:400">Does not provide viable cells for phase I osteogenesis.<br>Rigorous screening of donors is required to reduce the risk of disease transmission associated with osseous allografts.</td></tr>
</tbody></table></div></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Xenogeneic grafts</div>
<div class="defs"><div class="def"><b>Xenogeneic grafts (xenografts, heterografts)</b><p>Grafts taken from one species and grafted to another.</p></div></div>
<p>The antigenic dissimilarity of these grafts is <b>greater than with allogeneic bone</b>; therefore the graft must be treated more vigorously to prevent rapid rejection of the graft.</p>
<div class="sc"><table><thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td style="font-weight:400">Do not require another site of operation in the host.<br>Large quantity of bone can be obtained.</td><td style="font-weight:400">Do not provide viable cells for phase I osteogenesis.<br>Must be rigorously treated to reduce antigenicity.</td></tr>
</tbody></table></div></div>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>Allogeneic</b> = same species (allografts, homografts) · <b>xenogeneic</b> = different species (xenografts, heterografts), with greater antigenic dissimilarity → more vigorous treatment.</li>
<li>Allogeneic grafts give a matrix for <b>phase II</b> induction, but <b>no cells for phase I</b>.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Allograft rejection is primarily cell-mediated by T-lymphocytes.</li>
<li>6 treatments: boiling, deproteinization, freezing, freeze-drying, irradiation, dry heating.</li>
<li>Most commonly used allogeneic bone today: freeze dried.</li>
<li>Allografts need donor screening; xenografts need rigorous treatment.</li>
</ul></details>

<!-- ============ UNIT 7 ============ -->
<details class="ov-unit" data-title="Alloplasts &amp; adjuvants: BMPs" data-sub="Synthetic biomaterials, biologics that enhance repair, bone morphogenetic proteins">
<p class="ov-src">Source: Pages 6–7</p>
<div class="ov-core"><b>Core idea:</b> Alloplasts are synthetic osteoconductive fillers; adjuvants are biologics that enhance bone repair, of which BMPs are osteoinductive TGF-β family proteins delivered on a carrier.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Alloplasts</div>
<p>Alloplastic synthetic biomaterials have varying physicochemical properties and can be both <b>degradable and nondegradable</b>.</p>
<p>The most routinely used alloplastic materials are <b>hydroxyapatite, tricalcium phosphates, and bioactive glasses</b>.<span class="hy">★</span> These materials can be used alone or together with other substances to fill bony defects.</p>
<div class="sc"><table><thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td style="font-weight:400">Do not require another site of operation in the host.<br>Large quantity of bone can be obtained.</td><td style="font-weight:400">Do not provide viable cells for phase I osteogenesis.<br>Osteoconductive without any osteoinductive or osteogenic potential on their own.</td></tr>
</tbody></table></div>
<p class="flag">⚑ Source note: the source lists “Large quantity of bone can be obtained” as an advantage of alloplasts, although alloplasts are described as synthetic biomaterials. The wording is kept exactly as in the source.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Adjuvants</div>
<div class="defs"><div class="def"><b>Adjuvants</b><p>Biologics that are used to enhance bone repair. These range from blood components, gene therapy, and recombinant proteins.</p></div></div></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">Bone morphogenetic proteins (BMPs)</div>
<ul>
<li>BMPs are a group of <b>osteoinductive proteins</b> that belong to the <b>transforming growth factor-beta (TGF-β) family</b>.<span class="hy">★</span></li>
<li>They are capable of stimulating mesenchymal cells within the body to become osteoblastic and to form bone.</li>
<li>More than <span class="v">20</span> members were identified; <b>BMP2 and BMP7</b> are the most widely studied subtypes.</li>
<li><b>Advantage:</b> BMPs do not require another site of operation in the host.</li>
<li><b>Disadvantages:</b> BMPs do not provide viable cells for phase I osteogenesis; BMP is a liquid, therefore a carrier must be used to maintain the BMP at the site of implantation — currently a <b>collagen sponge</b> is used for this purpose.</li>
</ul></div>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>Alloplasts</b> are osteoconductive only · <b>BMPs</b> are osteoinductive proteins.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Alloplasts: hydroxyapatite, tricalcium phosphates, bioactive glasses; degradable or nondegradable.</li>
<li>Adjuvants: blood components, gene therapy, recombinant proteins.</li>
<li>BMPs: TGF-β family, &gt;20 members, BMP2 &amp; BMP7 most studied.</li>
<li>BMP carrier: collagen sponge.</li>
</ul></details>

<details class="ov-unit" data-title="Platelet concentrates: PRP, PRF, CGF" data-sub="Growth factors and the three generations">
<p class="ov-src">Source: Pages 7–8</p>
<div class="ov-core"><b>Core idea:</b> Autologous platelet concentrates deliver concentrated growth factors; the three generations differ in preparation (anticoagulant, centrifugation) and in how long they release growth factors.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Growth factors</div>
<p>The autologous platelet concentrates provide a high concentration of growth factors such as <b>platelet-derived growth factor (PDGF), TGF-β, insulin-like growth factor (IGF), epidermal growth factor (EGF) and vascular endothelial growth factor (VEGF)</b>. These growth factors enhance wound healing and have a potential bone regenerative effect.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Generations of platelet concentrates</div>
<div class="sc"><table><thead><tr><th>Concentrate</th><th>Generation</th><th>Preparation</th><th>Growth factor release</th><th>Other features</th></tr></thead><tbody>
<tr><td>Platelet-rich plasma (PRP)</td><td>First</td><td>Two-step centrifugation of collected blood <b>with</b> anticoagulant</td><td>Short period (<span class="v">24 hours</span>)<span class="hy">★</span></td><td>—</td></tr>
<tr><td>Platelet-rich fibrin (PRF)</td><td>Second</td><td>Constant speed single-step centrifugation <b>without</b> anticoagulant</td><td>Sustained and prolonged, for more than <span class="v">seven days</span></td><td>Anti-inflammatory effect attributed to the presence of leukocytes; forms a three-dimensional flexible and dense fibrin clot with a strong network to support cellular migration; can be used solely, compressed as a membrane, or combined with bone graft materials</td></tr>
<tr><td>Concentrated growth factor (CGF)</td><td>Third</td><td>Single step of centrifugation with <b>alternate</b> speed; anticoagulant unnecessary (similar to PRF)</td><td>Constant and sustained, longer than PRP and PRF, may last up to <span class="v">14 days</span><span class="hy">★</span></td><td>—</td></tr>
</tbody></table></div>

<details class="ov-unit" data-title="Combinations of grafts &amp; patient assessment" data-sub="Combination grafts; evaluating the patient, the hard tissue defect and the soft tissue bed">
<p class="ov-src">Source: Pages 8–9</p>
<div class="ov-core"><b>Core idea:</b> Grafts can be combined to merge scaffold and cells; before reconstruction every patient is assessed individually, including the size, site and fragment position of the bone defect and the quality of the soft tissue bed.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Combinations of grafts</div>
<p>A combination of bone grafts can be used, such as an <b>allogeneic graft as a scaffold</b> that provides the desired bulk and shape, supplemented with <b>autogenous particulate marrow and cancellous bone</b> to provide the osteogenic cells necessary for phase I bone formation.</p>
<ul><li><b>Advantages:</b> the same as those of autogenous and allogeneic grafts.</li>
<li><b>Disadvantage:</b> necessitates a second site of operation in the host to obtain the autogenous particulate marrow and cancellous bone graft.</li></ul>
<p class="flag">⚑ Source note: this section of the source spells the term “allogenic”; elsewhere the source uses “allogeneic”. Both refer to the same graft type.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Overall assessment</div>
<p>Patients who have defects of the jaws can usually be treated surgically to replace the lost portion. However, each patient must be thoroughly evaluated because <b>no two patients have the same problems</b>.</p>
<p>Analysis must consider the <b>hard tissue defect, any soft tissue defects, and any associated problems</b> that will affect treatment. The patient's <b>age, health, psychological state, and desires</b> must be assessed. Thorough understanding by the patient of the risks and benefits of any treatment recommendation is imperative so the patient can make an <b>informed decision</b>.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">Hard tissue defect</div>
<p>Osseous defects must be thoroughly assessed with adequate <b>clinical and radiographic evaluation</b> to assess the full extent of the bone defect. Important points to consider:</p>
<ol>
<li><b>The size of the defect.</b></li>
<li><b>The site of the defect:</b> defects of certain sites of the mandible are more difficult to reconstruct, such as continuity defects that cross the midline or that involve the condyle; a residual portion of the ramus with the condyle still attached makes osseous reconstruction easier because the temporomandibular articulation is difficult to restore.<span class="hy">★</span></li>
<li><b>The position of the residual fragments:</b> in continuity defects of the mandible the muscles of mastication no longer work in harmony and may severely displace residual mandibular fragments into unnatural positions.</li>
</ol></div>
<div class="ov-blk"><div class="ov-lbl" data-i="4">Soft tissue defect</div>
<p>A thorough assessment of the quantity and quality of surrounding soft tissue is necessary before bone graft procedures. The availability of an <b>adequately vascularized soft tissue bed</b> is an essential factor for the success of any bone-grafting procedure.<span class="hy">★</span></p>
<p>The vascular supply of the head and neck region is rich, which can provide well-vascularized soft tissue beds. However, in certain cases the soft tissue bed is not as desirable, for example:</p>
<ul><li>After radiotherapy</li><li>Excessive scarring from trauma or infection</li><li>Treatment of malignancies requiring composite resection of hard and soft tissues, resulting in deficiencies in the quantity and quality of the residual soft tissue</li></ul></div>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li>In a combination graft the <b>allogeneic</b> part gives bulk and shape (scaffold), the <b>autogenous particulate</b> part gives phase I cells.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Combination graft disadvantage: second operation site.</li>
<li>Assess age, health, psychological state and desires; informed decision.</li>
<li>Hard tissue: size, site, position of residual fragments.</li>
<li>Soft tissue bed must be adequately vascularized; radiotherapy, scarring and composite resection compromise it.</li>
</ul></details>

<!-- ============ UNIT 10 ============ -->
<details class="ov-unit" data-title="Mandibular defects: impact, goals &amp; HCL classification" data-sub="Causes, debilitating effects, three goals, HCL classes">
<p class="ov-src">Source: Pages 9–10</p>
<div class="ov-core"><b>Core idea:</b> Acquired mandibular defects (most often after ablative surgery) impair appearance and function; reconstruction restores continuity, alveolar height and bulk, and defects are described with the HCL classification.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Causes and impact</div>
<p>Acquired defects of the mandible result from trauma, infection, osteoradionecrosis, and, <b>most commonly, ablative surgery</b> of the oral cavity and lower face.<span class="hy">★</span></p>
<p>These defects are particularly debilitating not only because of the profoundly negative effect on facial appearance but also because they create disabilities of mastication and swallowing along with poor speech and oral competence.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Goals of mandibular reconstruction</div>
<ol>
<li><b>Restoration of continuity and contour</b> — the highest priority when reconstructing mandibular defects, to achieve better functional movements of the mandible and tongue and improved facial esthetics by realigning any deviated mandibular segments.<span class="hy">★</span></li>
<li><b>Restoration of alveolar bone height</b> — an adequate alveolar process must be provided to give a foundation for dental rehabilitation.</li>
<li><b>Restoration of osseous bulk</b> — any bone-grafting procedure must provide enough osseous tissue to withstand normal function.</li>
</ol></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">Defect types and localizations: HCL classification</div>
<p>Many classifications have been suggested; one of the most widely cited is the <b>HCL classification</b> introduced by <b>Jewer et al (1989)</b>:</p>
<div class="sc"><table><thead><tr><th>Letter</th><th>Represents</th></tr></thead><tbody>
<tr><td>C</td><td>Central defects involving both canines</td></tr>
<tr><td>L</td><td>Lateral defects excluding the condyle</td></tr>
<tr><td>H</td><td>Hemimandibular defects including the condyle</td></tr>
</tbody></table></div>
<p>Therefore, <span class="v">eight</span> possible types of mandibular defects can be encountered:<span class="hy">★</span></p>
<ul class="chips5"><li>C</li><li>L</li><li>H</li><li>LC</li><li>HC</li><li>LCL</li><li>HCL</li><li>HH</li></ul></div>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>L</b> = lateral, <i>excluding</i> the condyle · <b>H</b> = hemimandibular, <i>including</i> the condyle · <b>C</b> = central, involving both canines.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Most common cause: ablative surgery of oral cavity and lower face.</li>
<li>Goal #1 (highest priority): continuity and contour.</li>
<li>Goals #2 and #3: alveolar bone height, osseous bulk.</li>
<li>HCL (Jewer et al, 1989): 8 types — C, L, H, LC, HC, LCL, HCL, HH.</li>
</ul></details>
<div class="ov-cp" data-cp="[[&quot;Restoration of alveolar bone height is needed to:&quot;, [&quot;Withstand normal function&quot;, &quot;Provide a foundation for dental rehabilitation&quot;, &quot;Improve tongue movement&quot;, &quot;Classify the defect type&quot;], 1, &quot;An adequate alveolar process is the foundation for dental rehabilitation; withstanding function is the bulk goal. (Page 10)&quot;], [&quot;Which is one of the eight HCL defect types?&quot;, [&quot;CC&quot;, &quot;LH&quot;, &quot;LCL&quot;, &quot;HLC&quot;], 2, &quot;The eight types are C, L, H, LC, HC, LCL, HCL and HH. (Page 10)&quot;]]"></div>
</details>

<!-- ============ UNIT 11 ============ -->
<details class="ov-unit" data-title="Mandibular reconstructive options" data-sub="Reconstruction plates, non-vascularized grafts, pedicled flaps, vascularized free tissue transfer">
<p class="ov-src">Source: Pages 10–11</p>
<div class="ov-core"><b>Core idea:</b> Four options exist, from quick plate bridging (no donor site, but long-term complications) to vascularized free flaps that resist infection and allow simultaneous hard/soft tissue reconstruction and dental implants.</div>
<div class="ov-blk"><div class="ov-lbl" data-i="1">Gap bridging with reconstruction plates</div>
<ul>
<li>Rigid plates, mostly made of <b>titanium</b>, used for bridging mandibular continuity defects, stabilizing remaining segments, and maintaining occlusion and facial contour. Also used to fix non-vascularized bone blocks or vascularized bone grafts to the remaining mandible.</li>
<li>Relatively fast and simple, with <b>no donor site morbidity</b>.</li>
<li>Disadvantages of plates alone: long-term complications such as <b>hardware failure, dehiscence, and fistula</b>; they do not allow dental rehabilitation and fail to address soft-tissue defects.</li>
<li>Therefore plates alone are an option for patients who may not tolerate other means of reconstruction because of <b>medical comorbidities</b>, or as a <b>temporary measure</b> before definitive reconstruction.<span class="hy">★</span></li>
</ul></div>
<div class="ov-blk"><div class="ov-lbl" data-i="2">Non-vascularized autogenous bone graft</div>
<ul>
<li>Useful for <b>small-size defects</b>, especially those resulting from trauma or benign diseases that do not require radiation.</li>
<li>Less technique-sensitive than vascularized free flaps, with shorter operating time.</li>
<li>Require stability of the bone segments and an adequate healthy soft tissue bed to provide watertight closure and prevent oral contamination.</li>
<li>Considered <b>unpredictable</b> and associated with a <b>high failure rate</b>.</li>
</ul></div>
<div class="ov-blk"><div class="ov-lbl" data-i="3">Pedicled flaps</div>
<p>Example: a segment of the <b>clavicle</b> transferred to the mandible, pedicled to the <b>sternocleidomastoid muscle</b>.</p></div>
<div class="ov-blk"><div class="ov-lbl" data-i="4">Vascularized free tissue transfer</div>
<p>This method has revolutionized maxillofacial reconstruction. Vascularized free grafts can <b>resist infection</b> in the face of oral contamination, permit <b>simultaneous hard-tissue and soft-tissue reconstruction</b>, and allow <b>rapid dental rehabilitation with endosseous implants</b>.<span class="hy">★</span></p>
<div class="sc"><table><thead><tr><th>Vascularized free graft</th><th>Supplying artery</th></tr></thead><tbody>
<tr><td>Fibula flap</td><td>Peroneal artery<span class="hy">★</span></td></tr>
<tr><td>Iliac crest flap</td><td>Deep circumflex iliac artery (DCIA)</td></tr>
</tbody></table></div></div>
<figure class="ov-fig"><figcaption>Figure 11.1 — The four options compared (table built from Pages 10–11; no figure in the source)</figcaption>
<div class="sc"><table><thead><tr><th>Option</th><th>Use / indication</th><th>Strengths</th><th>Limitations</th></tr></thead><tbody>
<tr><td>Reconstruction plates alone</td><td>Patients who may not tolerate other means (medical comorbidities); temporary measure</td><td>Relatively fast and simple; no donor site morbidity</td><td>Hardware failure, dehiscence, fistula; no dental rehabilitation; do not address soft-tissue defects</td></tr>
<tr><td>Non-vascularized autogenous bone graft</td><td>Small-size defects, especially from trauma or benign diseases not requiring radiation</td><td>Less technique-sensitive than vascularized free flaps; shorter operating time</td><td>Needs stable segments and a healthy soft tissue bed; unpredictable; high failure rate</td></tr>
<tr><td>Pedicled flap</td><td>Example: clavicle pedicled to the sternocleidomastoid muscle</td><td>Preserves some blood supply (Unit 05)</td><td>Not stated in the source</td></tr>
<tr><td>Vascularized free tissue transfer</td><td>Fibula flap (peroneal artery); iliac crest flap (DCIA)</td><td>Resists infection; simultaneous hard- and soft-tissue reconstruction; rapid dental rehabilitation with endosseous implants</td><td>More technique-sensitive than non-vascularized grafts (comparison in the source)</td></tr>
</tbody></table></div></figure>
<div class="ov-mix"><b>⚠ Don't mix up</b><ul>
<li><b>Fibula flap → peroneal artery</b> · <b>iliac crest flap → deep circumflex iliac artery (DCIA)</b>.</li>
<li><b>Non-vascularized graft</b>: less technique-sensitive, shorter operation, but unpredictable · <b>vascularized free flap</b>: resists infection and allows implants.</li>
</ul></div>
<details class="ov-qr"><summary>Quick Review</summary><ul>
<li>Plates: titanium, fast, no donor site; long-term hardware failure, dehiscence, fistula.</li>
<li>Plates alone: comorbid patients or temporary measure.</li>
<li>Non-vascularized graft: small defects, high failure rate.</li>
<li>Pedicled flap example: clavicle on sternocleidomastoid.</li>
<li>Vascularized free flaps: fibula (peroneal), iliac crest (DCIA).</li>
</ul></details>

<script>/* ===== Study Smart MCQ (v2) — reads #ss-mcq-data, no storage, no pop-ups ===== */
(function(){
 const host=document.getElementById("ssq");if(!host)return;
 const DATA=JSON.parse(document.getElementById("ss-mcq-data").textContent);
 const LVS=["Easy","Medium","Hard"];
 const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
 const byLv=l=>DATA.filter(q=>q.level===l);
 const st={};DATA.forEach(q=>st[q.id]={sel:null,chk:false});
 const wrong=new Set();
 let view="lv",lv="Easy",list=byLv("Easy"),i=0,retry=false,mi=0;
 const tabs=E("div","ssq-tabs"),body=E("div","");host.append(tabs,body);
 function drawTabs(){
  tabs.innerHTML="";
  LVS.forEach(l=>{const qs=byLv(l),ok=qs.filter(q=>st[q.id].chk&&st[q.id].sel===q.answer).length,dn=qs.filter(q=>st[q.id].chk).length;
   const b=E("button","ssq-tab"+(view==="lv"&&lv===l&&!retry?" on":""),`<b>${l}</b><span>${qs.length} questions · ${dn} answered · ${ok} correct</span>`);b.type="button";
   b.onclick=()=>{view="lv";lv=l;list=byLv(l);i=0;retry=false;draw()};tabs.append(b)});
  const m=E("button","ssq-tab ssq-mist"+(view==="mist"?" on":""),`<b>My mistakes${wrong.size?` <i>${wrong.size}</i>`:""}</b><span>Questions you answered wrongly</span>`);m.type="button";
  m.onclick=()=>{view="mist";mi=0;draw()};tabs.append(m);
 }
 function qCard(q,s,onSel,onCheck,head){
  const c=E("div","ssq-card");
  c.append(E("div","ssq-meta",`${head}<span class="ssq-topic">${q.topic}</span>${q.hy?'<span class="ssq-hy">★ High-yield</span>':""}`));
  const h=E("h3","ssq-stem");h.textContent=q.q;c.append(h);
  const g=E("div","ssq-opts");g.setAttribute("role","radiogroup");g.setAttribute("aria-label","Answer options");
  q.options.forEach((o,k)=>{const b=E("button","ssq-opt","<b>"+"ABCD"[k]+"</b><span></span>");b.type="button";b.lastChild.textContent=o;
   b.setAttribute("role","radio");b.setAttribute("aria-checked",String(s.sel===k));
   if(s.chk){b.disabled=true;if(k===q.answer)b.classList.add("ok");else if(k===s.sel)b.classList.add("no")}else if(s.sel===k)b.classList.add("sel");
   b.onclick=()=>onSel(k);g.append(b)});
  c.append(g);
  if(s.chk){const ok=s.sel===q.answer,f=E("div","ssq-fb "+(ok?"ok":"no"));f.setAttribute("role","status");
   f.innerHTML=`<p class="ssq-res">${ok?"✓ Correct":"✗ Incorrect"}</p>`+(ok?"":`<p><b>Correct answer:</b> ${"ABCD"[q.answer]}) </p>`);
   if(!ok)f.lastChild.append(document.createTextNode(q.options[q.answer]));
   const x=E("p","","<b>Why:</b> ");x.append(document.createTextNode(q.explain));f.append(x);c.append(f)}
  return c;
 }
 function check(q){const s=st[q.id];if(s.sel==null||s.chk)return;s.chk=true;if(s.sel===q.answer)wrong.delete(q.id);else wrong.add(q.id)}
 function drawLevel(){
  if(i>=list.length)return results();
  const q=list[i],s=st[q.id],done=list.filter(x=>st[x.id].chk).length,ok=list.filter(x=>st[x.id].chk&&st[x.id].sel===x.answer).length;
  body.append(E("div","ssq-pr",`<b>${retry?"Retry · ":""}${lv}: question ${i+1} of ${list.length}</b><span>Answered ${done}/${list.length} · Score ${ok}</span>`));
  body.append(E("div","ssq-bar",`<i style="width:${done/list.length*100}%"></i>`));
  const dots=E("div","ssq-dots");
  list.forEach((x,k)=>{const t=st[x.id],d=E("button",(k===i?"cur ":"")+(t.chk?(t.sel===x.answer?"ok":"no"):""),String(k+1));d.type="button";
   d.setAttribute("aria-label","Question "+(k+1)+(t.chk?(t.sel===x.answer?" correct":" wrong"):""));d.onclick=()=>{i=k;draw()};dots.append(d)});
  body.append(dots);
  const c=qCard(q,s,k=>{if(!s.chk){s.sel=k;draw()}},null,`${lv} · Q${i+1}`);
  const bt=E("div","ssq-bt");
  const pv=E("button","ssq-b g","← Previous");pv.type="button";pv.disabled=i===0;pv.onclick=()=>{i--;draw()};
  const ck=E("button","ssq-b",s.chk?"Checked":"Check answer");ck.type="button";ck.disabled=s.chk||s.sel==null;ck.onclick=()=>{check(q);draw()};
  const nx=E("button","ssq-b g",i===list.length-1?"See results →":"Next →");nx.type="button";nx.onclick=()=>{i++;draw()};
  bt.append(pv,ck,nx);c.append(bt);body.append(c);
 }
 function results(){
  const n=list.length,ok=list.filter(q=>st[q.id].chk&&st[q.id].sel===q.answer).length,dn=list.filter(q=>st[q.id].chk).length,pct=Math.round(ok/n*100);
  const w=list.filter(q=>st[q.id].chk&&st[q.id].sel!==q.answer);
  const c=E("div","ssq-card ssq-sum",`<p class="ssq-big">${pct}%</p><h3>${retry?"Retry":lv} results: ${ok} / ${n} correct</h3><p class="ssq-sub">${dn<n?`${n-dn} question(s) not answered yet — use the numbers to go back. `:""}${pct>=80?"Excellent work.":pct>=50?"Good base — review the questions below.":"Reread the related Overview units, then retry."}</p>`);
  const bt=E("div","ssq-bt");
  if(w.length){const r=E("button","ssq-b","Retry wrong questions ("+w.length+")");r.type="button";r.onclick=()=>{w.forEach(q=>st[q.id]={sel:null,chk:false});list=w;i=0;retry=true;draw()};bt.append(r)}
  const rs=E("button","ssq-b g","Restart "+lv);rs.type="button";rs.onclick=()=>{byLv(lv).forEach(q=>st[q.id]={sel:null,chk:false});list=byLv(lv);i=0;retry=false;draw()};
  const rv=E("button","ssq-b g","Review from question 1");rv.type="button";rv.onclick=()=>{i=0;draw()};
  bt.append(rs,rv);c.append(bt);body.append(c);
  if(w.length){const r=E("div","ssq-card");r.append(E("h3","","Questions to review"));
   w.forEach(q=>{const d=E("div","ssq-rv");const h=E("p","ssq-rvq");h.textContent=q.q;d.append(h);
    const a=E("p","","<b>Your answer:</b> ");a.append(document.createTextNode(q.options[st[q.id].sel]));
    const b=E("p","","<b>Correct:</b> ");b.append(document.createTextNode(q.options[q.answer]));
    const x=E("p","ssq-sub");x.textContent=q.explain;d.append(a,b,x);r.append(d)});body.append(r)}
 }
 const mst={};
 function drawMist(){
  const ids=[...wrong];
  if(!ids.length&&!Object.keys(mst).length){body.append(E("div","ssq-card ssq-sum",'<p class="ssq-big">✓</p><h3>No mistakes to retry</h3><p class="ssq-sub">Every question you answer wrongly — in any level — is collected here. Answer it correctly and it leaves the list. This list lasts only while the page is open.</p>'));return}
  const pool=[...new Set([...Object.keys(mst),...ids])].map(id=>DATA.find(q=>q.id===id));
  if(mi>=pool.length){const left=wrong.size;body.append(E("div","ssq-card ssq-sum",`<p class="ssq-big">${left||"✓"}</p><h3>${left?"still in your list":"All mistakes cleared"}</h3>`));const b=E("button","ssq-b",left?"Go again":"Back to Easy");b.type="button";b.onclick=()=>{for(const k in mst)delete mst[k];if(left){mi=0}else{view="lv";lv="Easy";list=byLv("Easy");i=0}draw()};body.lastChild.append(b);return}
  const q=pool[mi],s=mst[q.id]||(mst[q.id]={sel:null,chk:false});
  body.append(E("div","ssq-pr",`<b>Mistake ${mi+1} of ${pool.length}</b><span>${q.level}</span>`));
  const c=qCard(q,s,k=>{if(!s.chk){s.sel=k;draw()}},null,"My mistakes");
  const bt=E("div","ssq-bt");
  const ck=E("button","ssq-b",s.chk?"Checked":"Check answer");ck.type="button";ck.disabled=s.chk||s.sel==null;ck.onclick=()=>{s.chk=true;if(s.sel===q.answer){wrong.delete(q.id);st[q.id]={sel:q.answer,chk:true}}draw()};
  const nx=E("button","ssq-b g",mi===pool.length-1?"Finish →":"Next →");nx.type="button";nx.onclick=()=>{mi++;draw()};
  bt.append(ck,nx);c.append(bt);body.append(c);
 }
 function draw(){drawTabs();body.innerHTML="";view==="mist"?drawMist():drawLevel()}
 document.addEventListener("keydown",e=>{
  if(!host.closest("section").classList.contains("on")||e.target.closest("input,textarea,select"))return;
  const k=e.key.toUpperCase(),idx="1234".indexOf(k)>=0?"1234".indexOf(k):"ABCD".indexOf(k);
  if(idx>=0&&k.length===1){const b=body.querySelectorAll(".ssq-opt")[idx];if(b&&!b.disabled){b.click();e.preventDefault()}}
  else if(e.key==="Enter"&&!e.target.closest("button")){const b=[...body.querySelectorAll(".ssq-b")].find(x=>/Check/.test(x.textContent));if(b&&!b.disabled){b.click();e.preventDefault()}}
  else if(e.key==="ArrowRight"&&view==="lv"&&i<list.length){i++;draw()}
  else if(e.key==="ArrowLeft"&&view==="lv"&&i>0){i--;draw()}

 draw();
})();

<script>/* ===== Study Smart Flash Cards (v2) — reads #ss-cards-data, no storage, no pop-ups ===== */
(function(){

 const missed=new Set();let deck="Easy",queue=[],n=0,again=0,seen=new Set(),flipped=false;

   const b2=E("button","ssc-b g","Restart "+(deck==="Missed"?"Easy":deck));b2.type="button";b2.onclick=()=>pick(deck==="Missed"?"Easy":deck);r.append(b2);d.append(r);stage.append(d);return}
  const c=queue[0],card=E("div","ssc-card"+(flipped?" on":""));card.tabIndex=0;card.setAttribute("role","button");card.setAttribute("aria-label",flipped?"Answer side. Press to see the prompt.":"Prompt side. Press to reveal the answer.");
  card.innerHTML=`<div class="ssc-in"><div class="ssc-f"><div class="ssc-m"><span>${esc(c.level)} · ${esc(c.type)}</span><span>${esc(c.topic)}</span>${c.hy?'<span class="ssc-hy">★ High-yield</span>':""}</div><h3>${esc(c.front)}</h3><small>Say the answer, then tap to flip</small></div>
   <div class="ssc-k"><small>Answer</small>${/(^|\s)1\)/.test(c.back)?`<ol class="ssc-a ssc-ol">${c.back.split(/\s*\d\)\s*/).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<p class="ssc-a">${esc(c.back)}</p>`}<p class="ssc-x">${esc(c.explain)}</p>${c.hook?`<p class="ssc-h">Memory hook: ${esc(c.hook)}</p>`:""}</div></div>`;
  card.onclick=()=>{flipped=!flipped;card.classList.toggle("on",flipped);acts()};stage.append(card);
  const act=E("div","ssc-act");stage.append(act,E("p","ssc-kbd","<kbd>Space</kbd> flip · <kbd>1</kbd> Again · <kbd>2</kbd> Got it"));
  function acts(){act.innerHTML="";if(!flipped){const b=E("button","ssc-b","Show answer");b.type="button";b.style.gridColumn="1/-1";b.onclick=()=>{flipped=true;card.classList.add("on");acts()};act.append(b);return}
   const a=E("button","ssc-b bad","Again"),g=E("button","ssc-b ok","Got it ✓");a.type=g.type="button";a.onclick=()=>rate(false);g.onclick=()=>rate(true);act.append(a,g)}
  acts()}
 function rate(ok){const c=queue.shift();if(!c)return;
  if(ok){if(!seen.has(c.id))missed.delete(c.id)}else{missed.add(c.id);seen.add(c.id);again++;queue.splice(Math.min(3,queue.length),0,c)}
  flipped=false;draw()}
 document.addEventListener("keydown",e=>{if(!host.closest("section").classList.contains("on")||e.target.closest("input,textarea,select"))return;
  const card=host.querySelector(".ssc-card");if(!card)return;
  if(e.key===" "){if(e.target.closest("button"))return;e.preventDefault();card.click()}
  else if(flipped&&e.key==="1")rate(false);else if(flipped&&e.key==="2")rate(true)});
 pick("Easy");
})();
</script>
<script>(function(){const x=document.getElementById("ss-extras");if(x&&x.textContent.trim())try{new Function(x.textContent)()}catch(e){console.error("Study Smart extras:",e)}})();</script>
